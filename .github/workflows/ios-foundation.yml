# Fase 01A — Fundación KMP: compila el framework iOS del módulo :shared
# y verifica que Android sigue verde. No toca los workflows Android existentes.
name: iOS Foundation (KMP shared)

on:
  workflow_dispatch:
  push:
    branches: ["feat/ios-foundation"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-framework:
    name: Kotlin/Native iOS framework (:shared)
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0"

      - name: Ensure Android 37 compatibility
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          test -d "$sdk_root/platforms/android-37.0"
          if [ ! -e "$sdk_root/platforms/android-37" ]; then
            ln -s "$sdk_root/platforms/android-37.0" "$sdk_root/platforms/android-37"
          fi
          ls -ld "$sdk_root/platforms/android-37" "$sdk_root/platforms/android-37.0"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Select Xcode 26.4.1 (if available)
        run: |
          echo "Available Xcode installations:"
          ls /Applications | grep -i xcode || true
          if [ -d "/Applications/Xcode_26.4.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
            echo "Selected Xcode 26.4.1"
          else
            echo "Xcode_26.4.1.app not found; keeping runner default"
          fi
          xcodebuild -version

      - name: Show toolchain versions
        run: |
          java -version
          xcrun --sdk iphonesimulator --show-sdk-version || true

      - name: List :shared tasks (config check)
        # repo gradle.properties raises the daemon heap for Android builds;
        # cap it here for the memory-limited macOS runner (CLI wins over file).
        run: >
          ./gradlew :shared:tasks --all
          -Dorg.gradle.jvmargs="-Xmx3g"
          -Pkotlin.daemon.jvm.options="-Xmx3g"

      - name: Build iosSimulatorArm64 framework
        run: >
          ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64
          -Dorg.gradle.jvmargs="-Xmx3g"
          -Pkotlin.daemon.jvm.options="-Xmx3g"

      - name: Build iosArm64 framework (device)
        run: >
          ./gradlew :shared:linkDebugFrameworkIosArm64
          -Dorg.gradle.jvmargs="-Xmx3g"
          -Pkotlin.daemon.jvm.options="-Xmx3g"

      - name: List framework output
        run: |
          ls -R shared/build/bin || true

      - name: Upload MeldShared framework (inspection only, not an IPA)
        uses: actions/upload-artifact@v4
        with:
          name: MeldShared-iosSimulatorArm64-framework
          path: shared/build/bin/iosSimulatorArm64/debugFramework/MeldShared.framework
          if-no-files-found: warn

  android-regression:
    name: Android regression (:app)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0"

      - name: Ensure Android 37 compatibility
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          test -d "$sdk_root/platforms/android-37.0"
          if [ ! -e "$sdk_root/platforms/android-37" ]; then
            ln -s "$sdk_root/platforms/android-37.0" "$sdk_root/platforms/android-37"
          fi
          ls -ld "$sdk_root/platforms/android-37" "$sdk_root/platforms/android-37.0"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          test -f "$HOME/.android/debug.keystore"

      - name: Assemble fossDebug (regression gate)
        run: ./gradlew :app:assembleFossDebug

      - name: Report result
        if: always()
        run: 'echo "android-regression job outcome: ${{ job.status }}"'

  ios-app:
    name: iOS app (MeldIOS.app, simulator)
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0"

      - name: Ensure Android 37 compatibility
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          test -d "$sdk_root/platforms/android-37.0"
          if [ ! -e "$sdk_root/platforms/android-37" ]; then
            ln -s "$sdk_root/platforms/android-37.0" "$sdk_root/platforms/android-37"
          fi
          ls -ld "$sdk_root/platforms/android-37" "$sdk_root/platforms/android-37.0"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Select Xcode 26.4.1 (if available)
        run: |
          echo "Available Xcode installations:"
          ls /Applications | grep -i xcode || true
          if [ -d "/Applications/Xcode_26.4.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
            echo "Selected Xcode 26.4.1"
          else
            echo "Xcode_26.4.1.app not found; keeping runner default"
          fi
          xcodebuild -version

      - name: Install XcodeGen 2.45.4 (pinned, checksum-verified)
        # XcodeGen 2.46.0 (brew, run #5) aborta con Trace/BPT trap: 5 durante
        # "Generating project...": se fija la última versión estable conocida,
        # descargada del release oficial y verificada por SHA-256.
        env:
          XCODEGEN_VERSION: 2.45.4
          XCODEGEN_SHA256: 090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/xcodegen"
          mkdir -p "$work"
          cd "$work"
          curl -fsSL -o xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  xcodegen.zip" | shasum -a 256 -c -
          rm -rf xcodegen-dist && mkdir -p xcodegen-dist
          unzip -o -q xcodegen.zip -d xcodegen-dist
          bin_path="$(find xcodegen-dist -name xcodegen -type f | head -n 1)"
          test -n "$bin_path"
          chmod +x "$bin_path"
          "$bin_path" --version
          echo "xcodegen binary: $bin_path"
          bin_dir="$(cd "$(dirname "$bin_path")" && pwd)"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: XcodeGen isolation test (minimal project)
        # FIX02 ciclo 1: distingue binario roto en el runner de spec roto.
        # Genera un proyecto mínimo en $RUNNER_TEMP con el MISMO binario y
        # guarda el log en xcodegen-minimal.log. Nunca falla el job (exit 0):
        # el árbitro es el artifact, no el exit code de este paso.
        run: |
          set -uo pipefail
          echo "--- host ---"
          sw_vers || true
          echo "--- binary ---"
          which xcodegen || true
          file "$(which xcodegen)" || true
          lipo -info "$(which xcodegen)" || true
          xcodegen --version || true
          echo "--- minimal spec ---"
          mini="$RUNNER_TEMP/xcodegen-minimal"
          rm -rf "$mini"
          mkdir -p "$mini/Hello"
          printf 'print("hi")\n' > "$mini/Hello/dummy.swift"
          cat > "$mini/project.yml" <<'EOF'
          name: Mini
          options:
            deploymentTarget:
              iOS: "16.0"
          configs:
            Debug: debug
            Release: release
          targets:
            Mini:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - path: Hello
          schemes:
            Mini:
              build:
                targets:
                  Mini: all
              run:
                config: Debug
          EOF
          cat "$mini/project.yml"
          echo "--- minimal generate ---"
          set +e
          ( cd "$mini" && xcodegen generate >"$GITHUB_WORKSPACE/xcodegen-minimal.log" 2>&1; echo "$?" >"$RUNNER_TEMP/xcmin.code" )
          mincode="$(cat "$RUNNER_TEMP/xcmin.code")"
          echo "minimal exit code: $mincode"
          cat "$GITHUB_WORKSPACE/xcodegen-minimal.log" || true
          echo "--- minimal output ---"
          ls -la "$mini" || true
          echo "isolation step done (never fails the job)"
          exit 0

      - name: XcodeGen spec bisection (V1-V5)
        # FIX02 ciclo 2: genera 5 variantes con el MISMO binario para aislar
        # la opción que dispara el fatalError. Nunca falla el job (exit 0):
        # el árbitro es el artifact xcodegen-isolation, no el exit code.
        # V1: Mini con 1 sola config Debug (sospechoso nº1).
        # V2: Mini + settings.base exacto del proyecto real.
        # V3: Mini + preBuildScripts exacto del proyecto real.
        # V4: Mini + sources excludes + info.plist.
        # V5: copia real de iosApp + config Release añadida (candidato fix).
        run: |
          set -uo pipefail
          bis="$RUNNER_TEMP/xcbis"
          logs="$GITHUB_WORKSPACE/xcbis-logs"
          rm -rf "$bis" "$logs"
          mkdir -p "$bis/V1/Hello" "$bis/V2/Hello" "$bis/V3/Hello" "$bis/V4/Hello" "$bis/V5" "$logs"
          for v in V1 V2 V3 V4; do printf 'print("hi")\n' > "$bis/$v/Hello/dummy.swift"; done
          cp "$GITHUB_WORKSPACE/iosApp/MeldIOS/Info.plist" "$bis/V4/Hello/Info.plist"
          cp -R "$GITHUB_WORKSPACE/iosApp/." "$bis/V5/"
          cat > "$bis/V1/project.yml" <<'SPEC_EOF_V1'
          name: V1SingleConfig
          options:
            deploymentTarget:
              iOS: "16.0"
          configs:
            Debug: debug
          targets:
            V1:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - path: Hello
          schemes:
            V1:
              build:
                targets:
                  V1: all
              run:
                config: Debug
          SPEC_EOF_V1
          cat > "$bis/V2/project.yml" <<'SPEC_EOF_V2'
          name: V2Settings
          options:
            deploymentTarget:
              iOS: "16.0"
          configs:
            Debug: debug
            Release: release
          targets:
            V2:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - path: Hello
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.eirom16.meldios
                  PRODUCT_NAME: MeldIOS
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGN_IDENTITY: ""
                  DEVELOPMENT_TEAM: ""
                  CODE_SIGNING_REQUIRED: NO
                  ENABLE_USER_SCRIPT_SANDBOXING: NO
                  ONLY_ACTIVE_ARCH: YES
                  FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
                  OTHER_LDFLAGS: $(inherited) -framework MeldShared
          schemes:
            V2:
              build:
                targets:
                  V2: all
              run:
                config: Debug
          SPEC_EOF_V2
          cat > "$bis/V3/project.yml" <<'SPEC_EOF_V3'
          name: V3Scripts
          options:
            deploymentTarget:
              iOS: "16.0"
          configs:
            Debug: debug
            Release: release
          targets:
            V3:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - path: Hello
              preBuildScripts:
                - name: Compile Kotlin Framework
                  basedOnDependencyAnalysis: false
                  script: |
                    if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
                      echo "Skipping Gradle build (IDE already built the framework)"
                      exit 0
                    fi
                    "$SRCROOT/../gradlew" -p "$SRCROOT/.." :shared:embedAndSignAppleFrameworkForXcode -Dorg.gradle.jvmargs="-Xmx3g" -Pkotlin.daemon.jvm.options="-Xmx3g"
          schemes:
            V3:
              build:
                targets:
                  V3: all
              run:
                config: Debug
          SPEC_EOF_V3
          cat > "$bis/V4/project.yml" <<'SPEC_EOF_V4'
          name: V4Info
          options:
            deploymentTarget:
              iOS: "16.0"
          configs:
            Debug: debug
            Release: release
          targets:
            V4:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - path: Hello
                  excludes:
                    - Info.plist
              info:
                path: Hello/Info.plist
          schemes:
            V4:
              build:
                targets:
                  V4: all
              run:
                config: Debug
          SPEC_EOF_V4
          awk '/^  Debug: debug$/{print; print "  Release: release"; next}1' "$bis/V5/project.yml" > "$bis/V5/project.yml.new"
          mv "$bis/V5/project.yml.new" "$bis/V5/project.yml"
          grep -n -A3 "^configs:" "$bis/V5/project.yml"
          : > "$logs/summary.txt"
          set +e
          for v in V1 V2 V3 V4 V5; do
            echo "=== $v ==="
            ( cd "$bis/$v" && xcodegen generate >"$logs/$v.log" 2>&1; echo "$?" >"$bis/$v.code" )
            code="$(cat "$bis/$v.code")"
            echo "$v exit: $code"
            echo "$v=$code" >> "$logs/summary.txt"
            echo "--- $v tail ---"
            tail -n 5 "$logs/$v.log" || true
          done
          echo "=== summary ==="
          cat "$logs/summary.txt"
          echo "bisection step done (never fails the job)"
          exit 0

      - name: Upload XcodeGen isolation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodegen-isolation
          path: |
            xcodegen-minimal.log
            xcbis-logs/
          if-no-files-found: warn

      - name: Generate Xcode project
        run: |
          cd iosApp
          set +e
          xcodegen generate 2>&1 | tee "$GITHUB_WORKSPACE/xcodegen.log"
          code="${PIPESTATUS[0]}"
          echo "xcodegen exit code: $code"
          ls -la
          exit "$code"

      - name: Collect XcodeGen crash reports
        if: failure()
        run: |
          mkdir -p diagnostics
          cp "$GITHUB_WORKSPACE/xcodegen.log" diagnostics/ 2>/dev/null || true
          echo "--- DiagnosticReports (Apple) ---"
          ls -lat ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -n 20 || true
          sleep 5
          while IFS= read -r report; do
            echo "copying: $report"
            cp "$report" diagnostics/ || true
          done < <(find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports -maxdepth 1 -iname "*xcodegen*" -type f 2>/dev/null | head -n 10)
          echo "--- diagnostics content ---"
          ls -la diagnostics/

      - name: Upload XcodeGen diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodegen-diagnostics
          path: diagnostics/
          if-no-files-found: warn

      - name: List schemes
        run: 'xcodebuild -list -project iosApp/MeldIOS.xcodeproj'

      - name: Build MeldIOS.app (simulator, unsigned)
        run: >
          xcodebuild -project iosApp/MeldIOS.xcodeproj
          -scheme MeldIOS -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath iosApp/build
          CODE_SIGNING_ALLOWED=NO build

      - name: Verify MeldShared export in generated header
        run: |
          header="$(find shared/build/xcode-frameworks -name MeldShared.h | head -n 1)"
          test -n "$header"
          echo "header: $header"
          grep -n "mainViewController" "$header"

      - name: Verify MeldIOS.app exists
        run: |
          ls -la iosApp/build/Build/Products/Debug-iphonesimulator/
          test -d "iosApp/build/Build/Products/Debug-iphonesimulator/MeldIOS.app"

      - name: Upload MeldIOS.app (simulator, unsigned — not an IPA)
        uses: actions/upload-artifact@v4
        with:
          name: MeldIOS-simulator-app
          path: iosApp/build/Build/Products/Debug-iphonesimulator/MeldIOS.app
          if-no-files-found: error
