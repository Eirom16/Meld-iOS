# Fase 02A — iOS-only: compila el framework iOS del módulo :shared, ejecuta
# las pruebas de lógica en host JVM, compila la app de simulador y el IPA de
# dispositivo. Sin regresión Android (settings.gradle.kts ya no incluye :app).
name: iOS Foundation (KMP shared)

on:
  workflow_dispatch:
  push:
    branches: ["feat/ios-foundation"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-framework:
    name: Kotlin/Native iOS framework (:shared)
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      # Fase 02A iOS-only: :shared ya no tiene target Android y settings ya
      # no incluye :app/:innertube; configurar el proyecto no requiere SDK.
      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Select Xcode 26.4.1 (if available)
        run: |
          echo "Available Xcode installations:"
          ls /Applications | grep -i xcode || true
          if [ -d "/Applications/Xcode_26.4.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
            echo "Selected Xcode 26.4.1"
          else
            echo "Xcode_26.4.1.app not found; keeping runner default"
          fi
          xcodebuild -version

      - name: Show toolchain versions
        run: |
          java -version
          xcrun --sdk iphonesimulator --show-sdk-version || true

      - name: List :shared tasks (config check)
        # repo gradle.properties raises the daemon heap for Android builds;
        # cap it here for the memory-limited macOS runner (CLI wins over file).
        run: >
          ./gradlew :shared:tasks --all
          -Dorg.gradle.jvmargs="-Xmx3g"
          -Pkotlin.daemon.jvm.options="-Xmx3g"

      - name: Build iosSimulatorArm64 framework
        run: >
          ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64
          -Dorg.gradle.jvmargs="-Xmx3g"
          -Pkotlin.daemon.jvm.options="-Xmx3g"

      - name: Build iosArm64 framework (device)
        run: >
          ./gradlew :shared:linkDebugFrameworkIosArm64
          -Dorg.gradle.jvmargs="-Xmx3g"
          -Pkotlin.daemon.jvm.options="-Xmx3g"

      - name: List framework output
        run: |
          ls -R shared/build/bin || true

      - name: Upload MeldShared framework (inspection only, not an IPA)
        uses: actions/upload-artifact@v4
        with:
          name: MeldShared-iosSimulatorArm64-framework
          path: shared/build/bin/iosSimulatorArm64/debugFramework/MeldShared.framework
          if-no-files-found: warn

  shared-tests:
    name: Shared logic tests (:shared jvmTest)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run shared tests (JVM host for commonTest)
        # Fase 02A: el target jvm/ existe solo para ejecutar aquí la lógica
        # común (modelos + repositorio demo); no es plataforma destino.
        run: >
          ./gradlew :shared:jvmTest
          -Dorg.gradle.jvmargs="-Xmx3g"
          -Pkotlin.daemon.jvm.options="-Xmx3g"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shared-jvmTest-reports
          path: shared/build/reports/tests/jvmTest
          if-no-files-found: warn

      - name: Report result
        if: always()
        run: 'echo "shared-tests job outcome: ${{ job.status }}"'

  ios-app:
    name: iOS app (MeldIOS.app, simulator)
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      # Fase 02A iOS-only: :shared ya no tiene target Android y settings ya
      # no incluye :app/:innertube; configurar el proyecto no requiere SDK.
      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Select Xcode 26.4.1 (if available)
        run: |
          echo "Available Xcode installations:"
          ls /Applications | grep -i xcode || true
          if [ -d "/Applications/Xcode_26.4.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
            echo "Selected Xcode 26.4.1"
          else
            echo "Xcode_26.4.1.app not found; keeping runner default"
          fi
          xcodebuild -version

      - name: Install XcodeGen 2.45.4 (pinned, checksum-verified)
        # XcodeGen 2.46.0 (brew, run #5) aborta con Trace/BPT trap: 5 durante
        # "Generating project...": se fija la última versión estable conocida,
        # descargada del release oficial y verificada por SHA-256.
        env:
          XCODEGEN_VERSION: 2.45.4
          XCODEGEN_SHA256: 090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/xcodegen"
          mkdir -p "$work"
          cd "$work"
          curl -fsSL -o xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  xcodegen.zip" | shasum -a 256 -c -
          rm -rf xcodegen-dist && mkdir -p xcodegen-dist
          unzip -o -q xcodegen.zip -d xcodegen-dist
          bin_path="$(find xcodegen-dist -name xcodegen -type f | head -n 1)"
          test -n "$bin_path"
          chmod +x "$bin_path"
          "$bin_path" --version
          echo "xcodegen binary: $bin_path"
          bin_dir="$(cd "$(dirname "$bin_path")" && pwd)"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: XcodeGen isolation test (minimal project)
        # FIX02 ciclo 1: distingue binario roto en el runner de spec roto.
        # Genera un proyecto mínimo en $RUNNER_TEMP con el MISMO binario y
        # guarda el log en xcodegen-minimal.log. Nunca falla el job (exit 0):
        # el árbitro es el artifact, no el exit code de este paso.
        run: |
          set -uo pipefail
          echo "--- host ---"
          sw_vers || true
          echo "--- binary ---"
          which xcodegen || true
          file "$(which xcodegen)" || true
          lipo -info "$(which xcodegen)" || true
          xcodegen --version || true
          echo "--- minimal spec ---"
          mini="$RUNNER_TEMP/xcodegen-minimal"
          rm -rf "$mini"
          mkdir -p "$mini/Hello"
          printf 'print("hi")\n' > "$mini/Hello/dummy.swift"
          cat > "$mini/project.yml" <<'EOF'
          name: Mini
          options:
            deploymentTarget:
              iOS: "16.0"
          configs:
            Debug: debug
            Release: release
          targets:
            Mini:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - path: Hello
          schemes:
            Mini:
              build:
                targets:
                  Mini: all
              run:
                config: Debug
          EOF
          cat "$mini/project.yml"
          echo "--- minimal generate ---"
          set +e
          ( cd "$mini" && xcodegen generate >"$GITHUB_WORKSPACE/xcodegen-minimal.log" 2>&1; echo "$?" >"$RUNNER_TEMP/xcmin.code" )
          mincode="$(cat "$RUNNER_TEMP/xcmin.code")"
          echo "minimal exit code: $mincode"
          cat "$GITHUB_WORKSPACE/xcodegen-minimal.log" || true
          echo "--- minimal output ---"
          ls -la "$mini" || true
          echo "isolation step done (never fails the job)"
          exit 0

      - name: Upload XcodeGen isolation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodegen-isolation
          path: xcodegen-minimal.log
          if-no-files-found: warn

      - name: Generate Xcode project
        run: |
          cd iosApp
          set +e
          xcodegen generate 2>&1 | tee "$GITHUB_WORKSPACE/xcodegen.log"
          code="${PIPESTATUS[0]}"
          echo "xcodegen exit code: $code"
          ls -la
          exit "$code"

      - name: Collect XcodeGen crash reports
        if: failure()
        run: |
          mkdir -p diagnostics
          cp "$GITHUB_WORKSPACE/xcodegen.log" diagnostics/ 2>/dev/null || true
          echo "--- DiagnosticReports (Apple) ---"
          ls -lat ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -n 20 || true
          sleep 5
          while IFS= read -r report; do
            echo "copying: $report"
            cp "$report" diagnostics/ || true
          done < <(find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports -maxdepth 1 -iname "*xcodegen*" -type f 2>/dev/null | head -n 10)
          echo "--- diagnostics content ---"
          ls -la diagnostics/

      - name: Upload XcodeGen diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodegen-diagnostics
          path: diagnostics/
          if-no-files-found: warn

      - name: List schemes
        run: 'xcodebuild -list -project iosApp/MeldIOS.xcodeproj'

      - name: Build MeldIOS.app (simulator, unsigned)
        # FIX03: el destino genérico fija ARCHS=arm64 x86_64 y la tarea
        # embedAndSignAppleFrameworkForXcode intenta compilar el slice iosX64,
        # sin variantes CMP 1.12.1 para ios_x64 (run #9). Se fuerza ARCHS=arm64
        # para que el script Kotlin seleccione iosSimulatorArm64. Debug se mantiene;
        # iosArm64 de dispositivo no se altera (job ios-framework intacto).
        # iosX64() se conserva en shared/ en este primer intento.
        run: >
          xcodebuild -project iosApp/MeldIOS.xcodeproj
          -scheme MeldIOS -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath iosApp/build
          ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build

      - name: Dump MeldShared header candidates (diagnostic)
        # FIX03 ciclo 2: si el build falla, el framework ya se compiló (la fase
        # de script corre antes de Compile Sources). Volcar los símbolos reales
        # evita otro ciclo a ciegas: el log muestra el nombre exacto del miembro.
        if: failure()
        run: |
          find shared/build -name MeldShared.h | head -n 5 || true
          header="$(find shared/build -name MeldShared.h | head -n 1)"
          if [ -n "$header" ]; then
            echo "header: $header"
            grep -n "ViewController" "$header" | head -n 20 || true
          else
            echo "no MeldShared.h found"
          fi

      - name: Verify MeldShared export in generated header
        run: |
          header="$(find shared/build/xcode-frameworks -name MeldShared.h | head -n 1)"
          test -n "$header"
          echo "header: $header"
          grep -n "MainViewController" "$header"

      - name: Verify MeldIOS.app exists
        run: |
          ls -la iosApp/build/Build/Products/Debug-iphonesimulator/
          test -d "iosApp/build/Build/Products/Debug-iphonesimulator/MeldIOS.app"

      - name: Verify Compose plist key (simulator)
        # FIX01D: inspeccion de solo lectura del .app ya compilado (no altera
        # su compilacion). Misma condicion que el job de IPA: la clave debe
        # ser booleano true o el job falla.
        run: |
          set -euo pipefail
          app="iosApp/build/Build/Products/Debug-iphonesimulator/MeldIOS.app"
          test -f "$app/Info.plist"
          python3 -c 'import plistlib, sys
          with open(sys.argv[1], "rb") as f:
              plist = plistlib.load(f)
          value = plist.get("CADisableMinimumFrameDurationOnPhone")
          assert type(value) is bool and value is True, "CADisableMinimumFrameDurationOnPhone must be boolean true"
          print("simulator Info.plist: CADisableMinimumFrameDurationOnPhone is boolean true")' "$app/Info.plist"

      - name: Upload MeldIOS.app (simulator, unsigned — not an IPA)
        uses: actions/upload-artifact@v4
        with:
          name: MeldIOS-simulator-app
          path: iosApp/build/Build/Products/Debug-iphonesimulator/MeldIOS.app
          if-no-files-found: error

  ios-device-ipa:
    name: iOS device IPA (arm64, unsigned)
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      # Fase 02A iOS-only: :shared ya no tiene target Android y settings ya
      # no incluye :app/:innertube; configurar el proyecto no requiere SDK.
      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Select Xcode 26.4.1 (if available)
        run: |
          echo "Available Xcode installations:"
          ls /Applications | grep -i xcode || true
          if [ -d "/Applications/Xcode_26.4.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
            echo "Selected Xcode 26.4.1"
          else
            echo "Xcode_26.4.1.app not found; keeping runner default"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen 2.45.4 (pinned, checksum-verified)
        # Misma version y SHA que el job ios-app (Fase 01B-FIX01/02): el
        # .xcodeproj se genera desde iosApp/project.yml, sin versionarlo.
        env:
          XCODEGEN_VERSION: 2.45.4
          XCODEGEN_SHA256: 090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/xcodegen"
          mkdir -p "$work"
          cd "$work"
          curl -fsSL -o xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  xcodegen.zip" | shasum -a 256 -c -
          rm -rf xcodegen-dist && mkdir -p xcodegen-dist
          unzip -o -q xcodegen.zip -d xcodegen-dist
          bin_path="$(find xcodegen-dist -name xcodegen -type f | head -n 1)"
          test -n "$bin_path"
          chmod +x "$bin_path"
          "$bin_path" --version
          echo "xcodegen binary: $bin_path"
          bin_dir="$(cd "$(dirname "$bin_path")" && pwd)"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        run: |
          cd iosApp
          set +e
          xcodegen generate 2>&1 | tee "$GITHUB_WORKSPACE/xcodegen-device.log"
          code="${PIPESTATUS[0]}"
          echo "xcodegen exit code: $code"
          ls -la
          exit "$code"

      - name: List schemes
        run: 'xcodebuild -list -project iosApp/MeldIOS.xcodeproj'

      - name: Archive MeldIOS for device (unsigned)
        # FASE 01C: iphoneos + generic/platform=iOS + ARCHS=arm64 para que el
        # script Kotlin seleccione iosArm64 (nunca iosSimulatorArm64/iosX64).
        # Sin firma (el propietario firma por su cuenta). Si `archive`
        # rechazara la falta de firma, el fallback compila para iphoneos y el
        # empaquetado manual produce el mismo IPA.
        run: |
          set -euo pipefail
          mkdir -p iosApp/build/device
          if xcodebuild -project iosApp/MeldIOS.xcodeproj \
            -scheme MeldIOS -configuration Debug \
            -destination 'generic/platform=iOS' \
            -archivePath iosApp/build/device/MeldIOS.xcarchive \
            -derivedDataPath iosApp/build/device/DerivedData \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            archive; then
            echo "archive path succeeded"
          else
            echo "archive failed; falling back to plain iphoneos build (unsigned)"
            xcodebuild -project iosApp/MeldIOS.xcodeproj \
              -scheme MeldIOS -configuration Debug \
              -sdk iphoneos \
              -derivedDataPath iosApp/build/device/DerivedData \
              ARCHS=arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
              build
            echo "fallback iphoneos build succeeded"
          fi

      - name: Locate MeldIOS.app (device)
        run: |
          set -euo pipefail
          arch_app="iosApp/build/device/MeldIOS.xcarchive/Products/Applications/MeldIOS.app"
          built_app="iosApp/build/device/DerivedData/Build/Products/Debug-iphoneos/MeldIOS.app"
          if [ -d "$arch_app" ]; then
            app="$arch_app"
          elif [ -d "$built_app" ]; then
            app="$built_app"
          else
            echo "MeldIOS.app not found in archive nor in build products:"
            find iosApp/build/device -maxdepth 6 -name "*.app" 2>/dev/null || true
            exit 1
          fi
          echo "device app: $app"
          ls -la "$app"
          echo "$app" > iosApp/build/device/app-path.txt

      - name: Package unsigned device IPA
        # Sin exportArchive (exige firma): ZIP manual con estructura IPA
        # estandar Payload/MeldIOS.app, conservando enlaces y permisos.
        run: |
          set -euo pipefail
          app="$(cat iosApp/build/device/app-path.txt)"
          test -d "$app"
          stage="iosApp/build/device/ipa-staging"
          out="iosApp/build/device/MeldIOS-unsigned-device.ipa"
          rm -rf "$stage" "$out"
          mkdir -p "$stage/Payload"
          ditto "$app" "$stage/Payload/MeldIOS.app"
          chmod +x "$stage/Payload/MeldIOS.app/MeldIOS"
          ( cd "$stage" && zip -qry ../MeldIOS-unsigned-device.ipa Payload )
          ls -la iosApp/build/device/
          test -s "$out"

      - name: Validate unsigned device IPA
        # Las 13 comprobaciones de las Fases 01C+01D-FIX01. Cualquier fallo
        # critico aborta el job (exit 1): nunca se publica un IPA invalido.
        run: |
          set -euo pipefail
          ipa="iosApp/build/device/MeldIOS-unsigned-device.ipa"
          report="iosApp/build/device/device-ipa-validation.txt"
          work="$RUNNER_TEMP/ipa-check"
          rm -rf "$work"
          mkdir -p "$work"
          pass() { echo "PASS: $1" | tee -a "$report"; }
          fail() { echo "FAIL: $1" | tee -a "$report"; exit 1; }
          : > "$report"
          echo "MeldIOS device IPA validation (UTC $(date -u +%FT%TZ))" | tee -a "$report"
          if [ -s "$ipa" ]; then
            pass "ipa exists and is non-empty"
          else
            fail "ipa missing or empty"
          fi
          if unzip -t "$ipa" >/dev/null; then
            pass "zip structure valid"
          else
            fail "zip integrity check failed"
          fi
          if unzip -l "$ipa" | grep -q "Payload/MeldIOS.app/"; then
            pass "contains Payload/MeldIOS.app"
          else
            fail "Payload/MeldIOS.app missing"
          fi
          unzip -q "$ipa" -d "$work"
          app="$work/Payload/MeldIOS.app"
          [ -d "$app" ] || fail "extracted app dir missing"
          bid="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          echo "bundle_id: $bid" | tee -a "$report"
          [ "$bid" = "com.eirom16.meldios" ] || fail "CFBundleIdentifier=$bid"
          pass "bundle id com.eirom16.meldios"
          exec_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          exec="$app/$exec_name"
          [ -f "$exec" ] || fail "main executable $exec_name missing"
          [ -x "$exec" ] || fail "executable bit missing on $exec_name"
          pass "main executable present and executable ($exec_name)"
          lipo_info="$(xcrun lipo -info "$exec")"
          echo "lipo: $lipo_info" | tee -a "$report"
          case "$lipo_info" in *arm64*) pass "architecture arm64";; *) fail "not arm64: $lipo_info";; esac
          case "$lipo_info" in *x86_64*) fail "contains x86_64 slice";; *) pass "no x86_64 slice";; esac
          file_info="$(file "$exec")"
          echo "file: $file_info" | tee -a "$report"
          vtool_out="$(xcrun vtool -show-build "$exec")"
          echo "$vtool_out" | tee -a "$report"
          # vtool imprime la plataforma como nombre (platform IOS) o como
          # numero LC_BUILD_VERSION (2 = iOS dispositivo, 7 = simulador).
          case "$vtool_out" in *IOSSIMULATOR*) fail "simulator platform detected";; *) pass "not a simulator binary";; esac
          if echo "$vtool_out" | grep -Eq 'platform (IOS *|2 *)$'; then
            pass "platform iOS (device)"
          elif echo "$vtool_out" | grep -Eq 'platform (IOSSIMULATOR *|7 *)$'; then
            fail "simulator platform detected"
          else
            fail "device iOS platform not detected"
          fi
          minos="$(echo "$vtool_out" | awk '/minos/ {print $2}')"
          echo "minos: $minos" | tee -a "$report"
          [ "$minos" = "16.0" ] || fail "minos=$minos"
          pass "minimum iOS 16.0"
          [ -f "$app/Info.plist" ] || fail "Info.plist missing in app"
          # FIX01D: la clave Compose debe ser booleano true (ni cadena "true"
          # ni numero). XcodeGen reescribia el plist sin ella (run #15) y la
          # app abortaba al arrancar (PlistSanityCheck -> SIGABRT).
          set +e
          plist_out="$(python3 -c 'import plistlib, sys
          with open(sys.argv[1], "rb") as f:
              plist = plistlib.load(f)
          value = plist.get("CADisableMinimumFrameDurationOnPhone")
          assert type(value) is bool and value is True, "CADisableMinimumFrameDurationOnPhone must be boolean true"
          print("CADisableMinimumFrameDurationOnPhone is boolean true")' "$app/Info.plist")"
          plist_code="$?"
          set -e
          echo "$plist_out" | tee -a "$report"
          if [ "$plist_code" -ne 0 ]; then
            fail "CADisableMinimumFrameDurationOnPhone missing or not boolean true"
          else
            pass "CADisableMinimumFrameDurationOnPhone boolean true"
          fi
          if otool -L "$exec" | grep -qi "meldshared"; then
            fail "MeldShared linked dynamically (expected static)"
          else
            pass "MeldShared statically linked (no dylib reference)"
          fi
          if [ -e "$app/Frameworks/MeldShared.framework" ]; then
            fail "embedded dynamic MeldShared.framework found"
          else
            pass "no embedded dynamic MeldShared"
          fi
          if codesign -dv "$exec" >"$work/codesign.txt" 2>&1; then
            cat "$work/codesign.txt" | tee -a "$report"
            fail "executable is signed (expected unsigned)"
          else
            pass "unsigned (no distribution signature)"
          fi
          # -Z1 lista solo nombres de fichero (sin la cabecera "Archive: ...",
          # que contiene la ruta local iosApp/build/... y falseaba el grep).
          if unzip -Z1 "$ipa" | grep -Ei "DerivedData|\.gradle|iphonesimulator|x86_64|/build/"; then
            fail "ipa contains build junk or simulator artifacts"
          else
            pass "no build junk or simulator artifacts"
          fi
          {
            echo "size_bytes: $(stat -f%z "$ipa")"
            echo "sha256: $(shasum -a 256 "$ipa" | awk '{print $1}')"
          } | tee -a "$report"
          pass "validation complete"

      - name: Dump device build diagnostics
        if: failure()
        run: |
          echo "--- device build tree ---"
          ls -R iosApp/build/device 2>/dev/null | head -n 100 || true
          echo "--- xcode-frameworks ---"
          find shared/build/xcode-frameworks -maxdepth 4 2>/dev/null | head -n 40 || true
          echo "--- xcodegen device log ---"
          head -n 40 "$GITHUB_WORKSPACE/xcodegen-device.log" 2>/dev/null || true

      - name: Upload unsigned device IPA
        uses: actions/upload-artifact@v4
        with:
          name: MeldIOS-unsigned-device-ipa
          path: iosApp/build/device/MeldIOS-unsigned-device.ipa
          if-no-files-found: error

      - name: Upload device IPA validation report
        uses: actions/upload-artifact@v4
        with:
          name: MeldIOS-device-validation
          path: iosApp/build/device/device-ipa-validation.txt
          if-no-files-found: error
