# Fase 01A — Fundación KMP: compila el framework iOS del módulo :shared
# y verifica que Android sigue verde. No toca los workflows Android existentes.
name: iOS Foundation (KMP shared)

on:
  workflow_dispatch:
  push:
    branches: ["feat/ios-foundation"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-framework:
    name: Kotlin/Native iOS framework (:shared)
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0"

      - name: Ensure Android 37 compatibility
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          test -d "$sdk_root/platforms/android-37.0"
          if [ ! -e "$sdk_root/platforms/android-37" ]; then
            ln -s "$sdk_root/platforms/android-37.0" "$sdk_root/platforms/android-37"
          fi
          ls -ld "$sdk_root/platforms/android-37" "$sdk_root/platforms/android-37.0"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Select Xcode 26.4.1 (if available)
        run: |
          echo "Available Xcode installations:"
          ls /Applications | grep -i xcode || true
          if [ -d "/Applications/Xcode_26.4.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
            echo "Selected Xcode 26.4.1"
          else
            echo "Xcode_26.4.1.app not found; keeping runner default"
          fi
          xcodebuild -version

      - name: Show toolchain versions
        run: |
          java -version
          xcrun --sdk iphonesimulator --show-sdk-version || true

      - name: List :shared tasks (config check)
        # repo gradle.properties raises the daemon heap for Android builds;
        # cap it here for the memory-limited macOS runner (CLI wins over file).
        run: >
          ./gradlew :shared:tasks --all
          -Dorg.gradle.jvmargs="-Xmx3g"
          -Pkotlin.daemon.jvm.options="-Xmx3g"

      - name: Build iosSimulatorArm64 framework
        run: >
          ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64
          -Dorg.gradle.jvmargs="-Xmx3g"
          -Pkotlin.daemon.jvm.options="-Xmx3g"

      - name: Build iosArm64 framework (device)
        run: >
          ./gradlew :shared:linkDebugFrameworkIosArm64
          -Dorg.gradle.jvmargs="-Xmx3g"
          -Pkotlin.daemon.jvm.options="-Xmx3g"

      - name: List framework output
        run: |
          ls -R shared/build/bin || true

      - name: Upload MeldShared framework (inspection only, not an IPA)
        uses: actions/upload-artifact@v4
        with:
          name: MeldShared-iosSimulatorArm64-framework
          path: shared/build/bin/iosSimulatorArm64/debugFramework/MeldShared.framework
          if-no-files-found: warn

  android-regression:
    name: Android regression (:app)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0"

      - name: Ensure Android 37 compatibility
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          test -d "$sdk_root/platforms/android-37.0"
          if [ ! -e "$sdk_root/platforms/android-37" ]; then
            ln -s "$sdk_root/platforms/android-37.0" "$sdk_root/platforms/android-37"
          fi
          ls -ld "$sdk_root/platforms/android-37" "$sdk_root/platforms/android-37.0"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          test -f "$HOME/.android/debug.keystore"

      - name: Assemble fossDebug (regression gate)
        run: ./gradlew :app:assembleFossDebug

      - name: Report result
        if: always()
        run: 'echo "android-regression job outcome: ${{ job.status }}"'
